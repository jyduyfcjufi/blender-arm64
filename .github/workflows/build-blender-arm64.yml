name: Build Blender Linux ARM64

# 直接源码构建：Arch Linux ARM64 容器 + Blender 官方源码 + 预编译 lib-linux_arm64
# 不走 Arch PKGBUILD / makepkg，不装系统版依赖编译，只用 Blender 自己的 make 流程。
# 触发方式：Actions -> Build Blender Linux ARM64 -> Run workflow，填版本号（默认 v5.3.0）。

on:
  workflow_dispatch:
    inputs:
      blender_tag:
        description: "Blender tag，例如 v5.3.0（最新稳定版）"
        required: true
        default: "v5.3.0"
        type: string
      build_target:
        description: "构建目标：standard=官方 release 全功能（无 GPU 二进制），lite=精简更快"
        required: true
        default: "standard"
        type: choice
        options:
          - standard
          - lite
      create_release:
        description: "构建成功后发一个 GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: blender-arm64-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -m
          nproc
          free -h
          df -h
          docker --version

      - name: Validate Blender tag
        run: |
          TAG="${{ inputs.blender_tag }}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::blender_tag 必须是 vX.Y.Z 格式，例如 v5.3.0，当前是 $TAG"
            exit 1
          fi
          if ! git ls-remote --tags https://github.com/blender/blender.git "$TAG" | grep -q "$TAG"; then
            echo "::error::在 blender/blender 上找不到 tag $TAG"
            exit 1
          fi
          echo "tag $TAG 存在，继续构建"

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /usr/lib/jvm 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          df -h

      - name: Add swap (private runner 只有 8G 内存，链接阶段容易 OOM)
        run: |
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile \
              && sudo mkswap /swapfile && sudo swapon /swapfile \
              && echo "swap 已开启" || echo "::warning::swap 开启失败，继续构建"
          fi
          free -h

      - name: Cache Blender precompiled libraries (lib-linux_arm64)
        uses: actions/cache@v4
        with:
          path: blender-git/lib
          key: blender-lib-arm64-${{ inputs.blender_tag }}
          restore-keys: |
            blender-lib-arm64-

      - name: Prepare Arch Linux ARM container image
        run: |
          chmod +x scripts/*.sh
          bash scripts/prepare-arch-image.sh

      - name: Build Blender inside Arch ARM container
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            arch-arm64:local \
            bash scripts/build-blender-arch.sh "${{ inputs.blender_tag }}" "${{ inputs.build_target }}"

      - name: Verify package
        run: |
          ls -lh out/
          for f in out/*; do
            echo "== $f =="
            file "$f" || true
            tar --list --zstd --file "$f" 2>/dev/null | head -n 20 \
              || tar --list --xz --file "$f" 2>/dev/null | head -n 20 \
              || tar --list --gzip --file "$f" 2>/dev/null | head -n 20 || true
          done
          test -n "$(ls -A out/)" || { echo "::error::out/ 为空，构建没有产出包"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-${{ inputs.blender_tag }}-linux-aarch64-arch
          path: out/*
          retention-days: 90

      - name: Create Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.blender_tag }}-arch-arm64
          name: "Blender ${{ inputs.blender_tag }} Linux ARM64 (Arch 源码构建)"
          body: |
            Blender ${{ inputs.blender_tag }}，直接源码构建，Arch Linux ARM64。
            - 构建方式：`make update`（官方预编译 lib-linux_arm64）+ `make release ninja`，目标 ${{ inputs.build_target }}
            - 运行环境：Arch Linux ARM aarch64，CPU 需支持 armv8.2-a+dotprod+fp16+lse（树莓派 5 / 骁龙 845 及更新 / 大多数 ARM64 机器都满足）
            - Cycles CPU 渲染可用；CUDA / OptiX / HIP / oneAPI 二进制已禁用（通用 ARM64 机器没有这些 GPU 工具链）
            - 解压即用：`tar -xf blender-*.tar.*`，运行里面的 `blender`
          files: out/*
          draft: false
          prerelease: false

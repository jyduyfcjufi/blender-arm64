name: Build Blender Linux ARM64

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git subversion cmake \
            libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev linux-libc-dev \
            libgl1-mesa-dev libegl-dev libgles2-mesa-dev \
            libpulse-dev libjack-dev libsndfile1-dev \
            libfreetype6-dev libfontconfig1-dev \
            libtbb-dev libopenvdb-dev libopencolorio-dev libopenimageio-dev \
            libboost-all-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev \
            libopenexr-dev libilmbase-dev \
            libfftw3-dev libxml2-dev libyaml-cpp-dev \
            libhdf5-dev libopenjp2-7-dev \
            libzstd-dev liblzma-dev liblz4-dev \
            libepoxy-dev libsdl2-dev \
            python3-dev python3-numpy python3-requests \
            libpotrace-dev libgmp-dev libpugixml-dev \
            nasm yasm patchelf

      - name: Get latest Blender release tag
        id: get_version
        run: |
          # 从Blender官方仓库获取最新release tag
          LATEST_TAG=$(git ls-remote --tags --sort=-v:refname \
            https://projects.blender.org/blender/blender.git \
            'v[0-9]*.[0-9]*.[0-9]*' | head -1 | sed 's|.*refs/tags/||')
          echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "获取到最新版本: ${LATEST_TAG}"

      - name: Clone Blender source
        run: |
          git clone --depth 1 --branch ${{ steps.get_version.outputs.tag }} \
            https://projects.blender.org/blender/blender.git blender-src

      - name: Update Blender submodules
        working-directory: blender-src
        run: |
          make update

      - name: Configure Blender with CMake
        run: |
          mkdir build && cd build
          cmake ../blender-src \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/blender \
            -DWITH_INSTALL_PORTABLE=ON \
            -DWITH_PYTHON_INSTALL=ON \
            -DWITH_CYCLES=ON \
            -DWITH_CYCLES_EMBREE=OFF \
            -DWITH_OPENCOLORIO=ON \
            -DWITH_OPENIMAGEIO=ON \
            -DWITH_OPENSUBDIV=ON \
            -DWITH_OPENVDB=ON \
            -DWITH_ALEMBIC=ON \
            -DWITH_CODEC_FFMPEG=ON \
            -DWITH_CODEC_SNDFILE=ON \
            -DWITH_FFTW3=ON \
            -DWITH_SDL=ON \
            -DWITH_JACK=ON \
            -DWITH_PULSEAUDIO=ON \
            -DWITH_MOD_OCEANSIM=ON \
            -DWITH_INTERNATIONAL=ON \
            -DWITH_POTRACE=ON

      - name: Build Blender
        run: |
          cd build
          make -j$(nproc)

      - name: Install Blender
        run: |
          cd build
          make install

      - name: Package Blender
        run: |
          TAG=${{ steps.get_version.outputs.tag }}
          tar -czf "blender-${TAG}-linux-arm64.tar.gz" -C /opt blender

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-${{ steps.get_version.outputs.tag }}-linux-arm64
          path: blender-*.tar.gz
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}-arm64
          name: "Blender ${{ steps.get_version.outputs.tag }} Linux ARM64"
          files: blender-*.tar.gz
          draft: false
          prerelease: false

name: Build Blender Linux ARM64

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Get latest Blender release tag
        id: get_version
        run: |
          LATEST_TAG=$(git ls-remote --tags --sort=-v:refname \
            https://projects.blender.org/blender/blender.git \
            'v[0-9]*.[0-9]*.[0-9]*' | head -1 | sed 's|.*refs/tags/||')
          echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "获取到最新版本: ${LATEST_TAG}"

      # ---- 缓存 APT 包 ----
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-arm64-${{ runner.os }}-v1
          restore-keys: apt-arm64-

      - name: Install build dependencies
        run: |
          # 如果缓存存在，先从缓存恢复
          if [ -d ~/apt-cache ]; then
            sudo cp -r ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git subversion cmake ccache \
            libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev linux-libc-dev \
            libgl1-mesa-dev libegl-dev libgles2-mesa-dev \
            libpulse-dev libjack-dev libsndfile1-dev \
            libfreetype6-dev libfontconfig1-dev \
            libtbb-dev libopenvdb-dev libopencolorio-dev libopenimageio-dev \
            libboost-all-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev \
            libopenexr-dev libilmbase-dev \
            libfftw3-dev libxml2-dev libyaml-cpp-dev \
            libhdf5-dev libopenjp2-7-dev \
            libzstd-dev liblzma-dev liblz4-dev \
            libepoxy-dev libsdl2-dev \
            python3-dev python3-numpy python3-requests \
            libpotrace-dev libgmp-dev libpugixml-dev \
            libvulkan-dev libshaderc-dev vulkan-validationlayers-dev spirv-tools \
            nasm yasm patchelf
          # 保存下载的 deb 到缓存目录
          mkdir -p ~/apt-cache
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

      # ---- 缓存 Blender 源码 ----
      - name: Cache Blender source
        id: cache_src
        uses: actions/cache@v4
        with:
          path: blender-src
          key: blender-src-${{ steps.get_version.outputs.tag }}

      - name: Clone Blender source
        if: steps.cache_src.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ steps.get_version.outputs.tag }} \
            https://projects.blender.org/blender/blender.git blender-src

      - name: Update Blender submodules
        if: steps.cache_src.outputs.cache-hit != 'true'
        working-directory: blender-src
        run: |
          make update

      # ---- 缓存 ccache 编译缓存 ----
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-arm64-${{ steps.get_version.outputs.tag }}-${{ github.sha }}
          restore-keys: |
            ccache-arm64-${{ steps.get_version.outputs.tag }}-
            ccache-arm64-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache -z

      - name: Configure Blender with CMake
        run: |
          mkdir -p build && cd build
          cmake ../blender-src \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/blender \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWITH_INSTALL_PORTABLE=ON \
            -DWITH_PYTHON_INSTALL=ON \
            -DWITH_CYCLES=ON \
            -DWITH_CYCLES_EMBREE=OFF \
            -DWITH_OPENCOLORIO=ON \
            -DWITH_OPENIMAGEIO=ON \
            -DWITH_OPENSUBDIV=ON \
            -DWITH_OPENVDB=ON \
            -DWITH_ALEMBIC=ON \
            -DWITH_CODEC_FFMPEG=ON \
            -DWITH_CODEC_SNDFILE=ON \
            -DWITH_FFTW3=ON \
            -DWITH_SDL=ON \
            -DWITH_JACK=ON \
            -DWITH_PULSEAUDIO=ON \
            -DWITH_MOD_OCEANSIM=ON \
            -DWITH_INTERNATIONAL=ON \
            -DWITH_POTRACE=ON

      - name: Build Blender
        run: |
          cd build
          make -j$(nproc)

      - name: Show ccache stats
        run: ccache -s

      - name: Install Blender
        run: |
          cd build
          make install

      - name: Package Blender
        run: |
          TAG=${{ steps.get_version.outputs.tag }}
          tar -czf "blender-${TAG}-linux-arm64.tar.gz" -C /opt blender

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-${{ steps.get_version.outputs.tag }}-linux-arm64
          path: blender-*.tar.gz
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}-arm64
          name: "Blender ${{ steps.get_version.outputs.tag }} Linux ARM64"
          files: blender-*.tar.gz
          draft: false
          prerelease: false
